onlyBuiltDependencies:
  - sharp
# Pin exact versions when adding dependencies
saveExact: true
# logo-soup asks for sharp ^0.34; share our copy so only one libvips is ever loaded
overrides:
  "logo-soup>sharp": 0.35.5
  # Security pins for transitive deps (Dependabot); drop once the parents ship them.
  # (Tailwind scans this file for class names, so keep utility words out of these comments.)
  # @tailwindcss/typography pins 6.0.10, quadratic parse patched in 7.1.6; 7.0's one break doesn't touch its usage
  "@tailwindcss/typography>postcss-selector-parser": 7.1.6
  # postcss under next and tailwind resolves 1.2.1, indexed-map DoS patched in 1.2.2
  source-map-js: 1.2.2
